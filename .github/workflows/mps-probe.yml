# Throwaway experiment for the torch 2.14 / macos-26 runner investigation: does a
# cheap MPS probe detect the Metal 4 cooperative-tensor compile failure on the
# hosted macos-26 (virtual GPU) image, and does the same probe pass on macos-15?
name: MPS probe

on:
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    name: MPS probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15]
    steps:
      - name: Runner hardware
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | grep -E "Chipset Model|Metal" || true
          echo "IMAGE=$ImageOS $ImageVersion"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install torch 2.14.0 only
        run: "python -m pip install --quiet --only-binary=:all: torch==2.14.0"
      - name: Probe MPS kernels
        run: |
          python - <<'PY'
          import itertools, platform, torch
          import torch.nn.functional as F
          print("macOS", platform.mac_ver()[0], "| torch", torch.__version__,
                "| mps available:", torch.backends.mps.is_available())
          d = "mps"
          failures = []
          def probe(name, fn):
              try:
                  fn()
                  print(f"OK    {name}")
              except Exception as e:  # noqa: BLE001
                  failures.append(name)
                  msg = str(e).replace("\n", " ")
                  print(f"FAIL  {name}: {type(e).__name__}: {msg[:120]}")
          # TabPFN's MPS attention backend: q/k/v shaped (B, H, S, D) with D padded to
          # a supported head dim, attn_mask=None, an explicit scale, optional GQA.
          def sdpa(dtype, D, S, gqa):
              H = 4
              q = torch.randn(1, H, S, D, device=d, dtype=dtype)
              kv_heads = 1 if gqa else H
              k = torch.randn(1, kv_heads, S, D, device=d, dtype=dtype)
              v = torch.randn(1, kv_heads, S, D, device=d, dtype=dtype)
              F.scaled_dot_product_attention(q, k, v, attn_mask=None, enable_gqa=gqa, scale=D**-0.5).sum().item()
          for dtype, D, S, gqa in itertools.product(
              (torch.float16, torch.bfloat16, torch.float32), (32, 64, 96, 128, 256), (16, 128, 1024), (False, True)
          ):
              probe(f"sdpa {str(dtype).split('.')[-1]:8s} D={D:3d} S={S:4d} gqa={gqa}", lambda: sdpa(dtype, D, S, gqa))
          # Same thing under autocast, as the estimators run it.
          for dtype in (torch.float16, torch.bfloat16):
              def under_autocast(dtype=dtype):
                  with torch.autocast("mps", dtype=dtype):
                      q = torch.randn(1, 4, 128, 64, device=d)
                      F.scaled_dot_product_attention(q, q, q, attn_mask=None, scale=64**-0.5).sum().item()
              probe(f"sdpa fp32 inputs under autocast({str(dtype).split('.')[-1]})", under_autocast)
          print("FAILED:", len(failures), failures[:8])
          PY
