name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 6.3.2)"
        required: true
      base_ref:
        description: "Commit SHA to release from"
        required: true
      base_branch:
        description: "Branch to open the PR against"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  release_pr:
    runs-on: ubuntu-latest
    environment: release
    # Inputs are exposed as environment variables rather than expanded into
    # scripts, so they cannot inject shell commands.
    env:
      VERSION: ${{ inputs.version }}
      BASE_REF: ${{ inputs.base_ref }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      RELEASE_BRANCH: release/v${{ inputs.version }}
    steps:
      - name: Guard base_ref, must be a full 40-char commit SHA
        run: |
          echo "${BASE_REF}" | grep -Eq '^[0-9a-f]{40}$' || {
              echo "base_ref must be a full 40-char commit SHA (got: ${BASE_REF})"
              exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Credentials must persist: a later step pushes the release branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # setup-uv v10 stopped pruning the uv cache before saving, so caches grow
          # without bound. Prune again, and only save on main so PR runs cannot
          # flood the repo's shared Actions cache quota; PRs still restore from main.
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Towncrier
        run: uv pip install --system towncrier

      - name: Create release branch from base ref
        run: |
          git fetch --all --tags
          git checkout --detach "${BASE_REF}"
          git checkout -b "${RELEASE_BRANCH}"

      - name: Bump version in pyproject.toml
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          p = Path("pyproject.toml")
          s = p.read_text(encoding="utf-8")

          pat = r'(?ms)(^\[project\]\s*\n.*?^\s*version\s*=\s*")([^"]+)(")'
          m = re.search(pat, s)
          if not m:
            raise SystemExit("Could not find [project].version in pyproject.toml")

          out = s[:m.start(2)] + version + s[m.end(2):]
          p.write_text(out, encoding="utf-8")
          print("Bumped [project].version to", version)
          PY

      - name: Towncrier build (updates CHANGELOG.md, deletes fragments)
        run: towncrier build --version "${VERSION}" --yes

      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml CHANGELOG.md changelog || true

          if git diff --cached --quiet; then
            echo "No changes staged. Are there changelog fragments to release?"
            exit 1
          fi

          git commit -m "Release v${VERSION}"

      - name: Push branch
        run: git push --set-upstream origin "${RELEASE_BRANCH}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
          --base "${BASE_BRANCH}" \
          --head "${RELEASE_BRANCH}" \
          --title "Release v${VERSION}" \
          --body "Automated release PR for v${VERSION}."
