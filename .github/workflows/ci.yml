name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  TABPFN_MODEL_CACHE_DIR: ${{ github.workspace }}/model_cache
  HF_HUB_CACHE: ${{ github.workspace }}/hf_cache

jobs:
  check_python_linting:
    name: Ruff Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check"
          version-file: pyproject.toml

  test_compatibility:
    name: Test Package Compatibility
    # This job will only start after linting succeeds
    needs: check_python_linting
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 3.14 highest is not included here because it is executed as a
        # separate workflow below. This is because we wish to gate the GPU workflow on
        # it, which requires a separate workflow.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            dependency-set: lowest-direct
          # Note that new pytorch versions >= 2.5 don't support x86 on mac anymore,
          # and macos-latest (ARM) is python >= 3.11 only, so we disable this runner.
          # https://github.com/actions/setup-python/issues/855
          # - os: macos-15-intel # We need x86 as ARM is python>= 3.11 only.
          #  python-version: "3.10"
          #  dependency-set: lowest-direct
          - os: windows-latest
            python-version: "3.10"
            dependency-set: lowest-direct
          - os: macos-latest
            python-version: "3.14"
            dependency-set: highest
          - os: windows-latest
            python-version: "3.14"
            dependency-set: highest
    runs-on: ${{ matrix.os }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group ci --resolution ${{ matrix.dependency-set }}

      - name: "Check for forbidden licenses"
        shell: bash
        run: |
          uv run --no-sync licensecheck \
            --requirements-paths pyproject.toml \
            --show-only-failing \
            -0

      # We use a persistent HuggingFace cache to avoid hitting rate limits.
      - &restore-hf-cache
        name: Restore HuggingFace cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/hf_cache
          key: hf-cache-${{ hashFiles('hf_cache/**') }}
          restore-keys: |
            hf-cache-
          enableCrossOsArchive: true

      # We separately cache TabPFN model checkpoints. This is required so that PRs from
      # forks, which can't access HF_TOKEN/TABPFN_TOKEN, already have the checkpoint
      # files they need.
      - &restore-model-cache
        name: Restore model cache
        id: restore-model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/model_cache
          key: model-cache-${{ hashFiles('model_cache/**') }}
          restore-keys: |
            model-cache-
          enableCrossOsArchive: true

      - &download-models
        name: Download models from Hugging Face
        run: uv run --no-sync python scripts/download_all_models.py

      - &save-model-cache
        name: Save model cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/model_cache
          key: model-cache-${{ hashFiles('model_cache/**') }}
          enableCrossOsArchive: true

      # Diagnostics for the intermittent Windows abort
      # `Windows fatal exception: code 0xc000001d` (STATUS_ILLEGAL_INSTRUCTION),
      # which kills roughly 1 in 10 Windows jobs. Every occurrence dies at the
      # same test -- the suite's first fit/predict on real weights -- under both
      # dependency sets, and a retry clears it. faulthandler cannot walk the
      # native stack on Windows ("cannot get C stack on this system"), so the
      # log never names the faulting DLL; record the CPU and the ISA torch
      # picks for it instead.
      #
      # Run 30531520172 caught the split: the job on an Intel Xeon Platinum
      # 8573C (Emerald Rapids, cpu_capability AVX512) aborted, while the job on
      # an AMD EPYC 7763 (AVX2, no AVX-512) in the same run passed. So the
      # abort happens on the runner with MORE ISA available, not less -- the
      # opposite of a wheel built for an ISA the CPU lacks. The prime suspect
      # is AMX, which Emerald Rapids advertises in CPUID but which Windows
      # leaves off until a process opts into the tile XSTATE; an AMX kernel
      # dispatched without that opt-in raises exactly this exception code.
      # Remove all of this once the flake is understood.
      - name: Log CPU and torch dispatch info (Windows only)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          pwsh -NoProfile -Command "Get-CimInstance Win32_Processor |
            Format-List Name, Manufacturer, Description, NumberOfCores,
            NumberOfLogicalProcessors"
          uv run --no-sync python -c '
          import torch
          print("torch", torch.__version__)
          print("cpu_capability", torch.backends.cpu.get_cpu_capability())
          print(torch.__config__.parallel_info())
          print(torch.__config__.show())
          '

      # Runs the known-flaky test on its own, ahead of the suite. It reproduces
      # the abort in ~10s on an affected runner, so when the control run dies we
      # immediately re-run it under each dispatcher cap in turn. One unlucky job
      # then answers both open questions at once: which library was mid-dispatch
      # (ONEDNN_VERBOSE names the primitive and ISA of the last kernel before
      # the abort) and which cap is enough to prevent it. The cheapest cap that
      # survives is the fix; capping to AVX2 also works but costs ~3x runtime.
      # On the ~9 in 10 runners that are unaffected only the control run
      # happens, so this normally adds a few seconds. Advisory only:
      # `continue-on-error` plus the trailing `exit 0` keep the real test steps
      # below in charge of the job's verdict.
      - name: Crash canary and dispatcher probe (Windows only)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          test_id="tests/test_classifier_interface.py::test__predict__show_progress_bar_true__tiny_dataset_does_not_crash"
          results="${RUNNER_TEMP:-.}/canary-results.txt"
          : > "$results"
          probe() {
            label="$1"
            shift
            echo "::group::canary [$label] $*"
            env "$@" uv run --no-sync pytest -q "$test_id" 2>&1 | tail -60
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            printf '%-18s exit=%-4s %s\n' "$label" "$code" "$*" >> "$results"
            return "$code"
          }

          probe control
          if [ $? -ne 0 ]; then
            echo "Control run aborted: this runner reproduces the flake."
            echo "Probing which dispatcher issues the illegal instruction."
            probe onednn-verbose ONEDNN_VERBOSE=1
            probe onednn-no-amx  ONEDNN_MAX_CPU_ISA=AVX512_CORE_FP16
            probe onednn-avx512  ONEDNN_MAX_CPU_ISA=AVX512_CORE
            probe onednn-avx2    ONEDNN_MAX_CPU_ISA=AVX2
            probe mkl-no-amx     MKL_ENABLE_INSTRUCTIONS=AVX512
            probe aten-avx2      ATEN_CPU_CAPABILITY=avx2
          fi

          echo "=== canary summary (exit=0 means the test survived) ==="
          cat "$results"
          exit 0

      - name: Run Tests (all tests)
        if: ${{ matrix.dependency-set != 'lowest-direct' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: uv run --no-sync pytest tests/

      - name: Run Tests (PR tests only)
        if: ${{ matrix.dependency-set != 'lowest-direct' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        run: uv run --no-sync pytest -m "not slow" tests/

      # We don't support MPS below PyTorch 2.5 (see tabpfn.utils.infer_devices()), thus
      # disable MPS for the lowest-direct dependency set.

      - name: Run Tests (all tests, MPS disabled)
        if: ${{ matrix.dependency-set == 'lowest-direct' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        env:
          TABPFN_EXCLUDE_DEVICES: mps
        run: uv run --no-sync pytest tests/

      - name: Run Tests (PR tests only, MPS disabled)
        if: ${{ matrix.dependency-set == 'lowest-direct' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          TABPFN_EXCLUDE_DEVICES: mps
        run: uv run --no-sync pytest -m "not slow" tests/

        # Save even if tests failed: partial downloads avoid future runs hitting the
        # rate limits.
      - &save-hf-cache
        name: Save HuggingFace cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/hf_cache
          key: hf-cache-${{ hashFiles('hf_cache/**') }}
          enableCrossOsArchive: true

  # -------------------------------------------------------------------
  # Ubuntu-latest + highest dependencies (used as gate for GPU)
  # -------------------------------------------------------------------
  test_ubuntu_latest_314:
    name: Test Ubuntu-latest (Py 3.14)
    needs: check_python_linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group ci --resolution highest
        shell: bash

      - name: "Check for forbidden licenses"
        shell: bash
        run: |
          uv run --no-sync licensecheck \
            --requirements-paths pyproject.toml \
            --show-only-failing \
            -0

      - *restore-hf-cache
      - *restore-model-cache
      - *download-models
      - *save-model-cache

      - name: Run Tests
        run: uv run --no-sync pytest tests/

      - *save-hf-cache

  # -------------------------------------------------------------------
  # First Party Packages
  # -------------------------------------------------------------------

  test_first_party_packages:
    name: Test ${{ matrix.repo-name }}
    needs: check_python_linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        repo-name:
          - tabpfn-extensions
          - tabpfn-time-series
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
      # Disable xet chunk cache to prevent disk exhaustion from 40+ model downloads.
      # Xet caches each downloaded file's chunks in ~/.cache/huggingface/xet/,
      # roughly doubling the effective disk footprint on the runner.
      HF_HUB_DISABLE_XET: "1"

    steps:
      - name: Checkout TabPFN at current ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          path: TabPFN

      - name: Checkout ${{ matrix.repo-name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1
        with:
          repository: PriorLabs/${{ matrix.repo-name }}
          path: ${{ matrix.repo-name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      # `tabpfn-time-series[benchmarking]` pulls autogluon-timeseries, which
      # transitively pulls torch + the full CUDA wheel stack (cuBLAS, cuDNN,
      # NCCL, etc.). Extracting torch's libtorch_cuda.so alone tips the
      # ubuntu-latest runner over its ~14 GB free-space budget — see the
      # `No space left on device` failure at
      # https://github.com/PriorLabs/TabPFN-private/actions/runs/26626285966/job/78463753025.
      # Reclaim ~30 GB by deleting Android SDK / Haskell / dotnet / large
      # preinstalled toolchains we don't use. Skipped for tabpfn-extensions
      # because its install footprint comfortably fits.
      - name: Free runner disk space
        if: matrix.repo-name == 'tabpfn-time-series'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - *restore-hf-cache

      - name: Restore model cache
        id: restore-model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/model_cache
          key: model-cache-${{ hashFiles('model_cache/**') }}
          restore-keys: |
            model-cache-
          enableCrossOsArchive: true
        # We don't save the model cache in this workflow as the main CI workflow already
        # saves it.

      - name: Download models from Hugging Face
        run: |
          cd TabPFN
          uv run python scripts/download_all_models.py
          cd ..

      - name: Install dependencies and run tests
        env:
          FAST_TEST_MODE: 1 # Configures -extensions to run a smaller set of tests.
        run: |
          cd ${{ matrix.repo-name }}
          uv run --with ../TabPFN --all-extras pytest -m "not uses_tabpfn_client"

      - *save-hf-cache

  # -------------------------------------------------------------------
  # GPU: To save compute we only want to execute this workflow once
  # a CPU workflow has passed. Hence, this workflow depends on the
  # ubuntu-latest 3.14 workflow above.
  # -------------------------------------------------------------------
  test_gpu:
    name: Test on GPU
    needs:
      - test_ubuntu_latest_314
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            dependency-set: lowest-direct
          - python-version: "3.14"
            dependency-set: highest

    runs-on: ubuntu-22.04-4core-gpu
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group ci --resolution ${{ matrix.dependency-set }}

      - *restore-hf-cache
      - *restore-model-cache
      - *download-models
      - *save-model-cache

      - name: Run GPU Test Suite
        env:
          CUDA_VISIBLE_DEVICES: "0"
          # skip cpu based tests that were run separately
          TABPFN_EXCLUDE_DEVICES: "cpu,cpu:0,mps"
        run: uv run --no-sync pytest tests/

      - *save-hf-cache
