name: Documentation improvement
description: Create a report to help us improve the documentation. Alternatively you can just open a pull request with the suggested change.
labels: [documentation]

body:
- type: textarea
  attributes:
    label: Describe the issue linked to the documentation
    description: >
      Tell us about the confusion introduced in the documentation.
  validations:
    required: true
- type: textarea
  attributes:
    label: Suggest a potential alternative/fix
    description: >
      Tell us how we could improve the documentation in this regard.
- type: dropdown
  id: ai-assistance
  attributes:
    label: AI assistance
    description: >
      Did you use AI tools to find, investigate or write up this report? See
      [AI-assisted contributions](https://github.com/PriorLabs/TabPFN/blob/main/CONTRIBUTING.md#ai-assisted-contributions).
      Fully automated submissions without human review will be closed.
    options:
      - "No"
      - "Yes, and I have reviewed this report myself"
  validations:
    required: true
