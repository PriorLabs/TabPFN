version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Only propose versions old enough to pass uv's `exclude-newer = "7 days"`
    # quarantine (see pyproject.toml).
    cooldown:
      default-days: 8

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Match the pip quarantine above: only propose releases that have been public
    # for a while, so a compromised release is likely caught before we adopt it.
    cooldown:
      default-days: 8
